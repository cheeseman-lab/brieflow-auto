# --- plugin-side config (NOT patched into any notebook) ---
sweep_tiles:
  n_tiles: 5
  max_tiles: 10                     # cap the reactive sweep to a well-spread sample (plate-size-independent)
  max_parallel_kernels: 3           # sweep tiles concurrently on this many live marimo kernels (1 = sequential)
  kernel_timeout_s: 900             # per-value limit and baseline floor; the baseline limit scales with tile image size
  run_in_allocation: true           # backend=slurm: sweeps run on a compute node through srun, never on the runner's host
  alloc_cpus_per_kernel: 4
  alloc_mem_gb_per_kernel: 24
  alloc_time: "8:00:00"
merge_approach:                   # derives MERGE_APPROACH (brieflow_interview.derive_merge_approach)
  max_cells_per_tile: 60          # measured median phenotype cells/tile below this -> "positions"; fast failed at 18-29 and worked at ~130
  min_objective_x: 40             # before phenotype cell counts exist: phenotype objective >= this -> "positions"
merge_alignment:
  n_initial_sbs_tiles: 20           # anchors offered to fast_alignment; ~half fail the det/score filter on hard screens and merge needs >=5 survivors (clamped to tiles available)
recovery: {max_attempts: 3}
cluster_selection:                # QC selection criteria; pairs with qc_gates cluster genes_per_cluster gate
  target_genes_per_cluster: 20
  genes_per_cluster_tolerance: 5
# qc_gates live in qc_gates.yaml (the QC foundation); referenced, not duplicated
