autonomy_mode: interactive        # interactive | unattended

# --- values patched into notebook vars: keys are the EXACT notebook variable ---
sweep_bands:
  # Adaptive coarse-to-fine: sweep the coarse band, then refine ±refine_radius
  # around the winner at refine_step. refine_radius = coarse_step/2 guarantees
  # the refine pass tiles the gap to the adjacent coarse point. A plain list
  # (instead of a dict) means a fixed, non-adaptive sweep.
  sbs:
    THRESHOLD_READS:               # -> config sbs.threshold_peaks
      coarse: [50, 100, 200, 400, 800, 1600, 3200]   # log-spaced: screen-independent (peak scores span ~2 decades across screens)
      refine_radius: 100
      refine_step: 50
      min: 25
      max: 6400
    PEAK_WIDTH:                    # all 5 reference screens used 5, but likely artificially low
      coarse: [3, 5, 7, 9, 11, 13, 15]
      refine_radius: 2
      refine_step: 1
      min: 3
      max: 20
  phenotype: {}                   # NUCLEI_DIAMETER is cellpose-auto-estimated per screen; nothing to sweep

sweep_joint:                      # params swept TOGETHER (outer -> inner, DAG order) on one live kernel
  sbs: [PEAK_WIDTH, THRESHOLD_READS]   # per tile: product of coarse bands + local refine, no re-segmentation

